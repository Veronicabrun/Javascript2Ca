<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/css/style.css"> 
    <!-- Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand ms-3" href="/index.html">UnityYoga</a>
            <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-3">
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline active" href="#">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/post/post-detail.html">Post</a>
                    </li>
                </ul>

                <button id="logout-button" class="btn btn-outline-danger ms-auto d-flex align-items-center">
                    <i class="bi bi-box-arrow-right me-2"></i> Log Out
                </button>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Search and Sort Section -->
        <section class="d-flex justify-content-between mb-4 mt-5">
            <input type="text" id="search-input" class="form-control me-2" placeholder="Search posts">
            <select id="sort-select" class="form-control w-auto">
                <option selected value="newest">Sort by: Newest</option>
                <option value="oldest">Oldest</option>
                <option value="popular">Most Popular</option>
            </select>
        </section>

        <!-- Profile Component -->
        <section class="container mb-4">
            <div class="card">
                <div class="card-body d-flex align-items-center">
                    <img src="/images/profile_feed.jpg" alt="Profile Picture" class="rounded-circle me-3 img-fluid profile-picture">
                    <div>
                        <h5 class="mb-2">Julie Evans</h5>
                        <p class="mb-2"><span class="text-dark">Følgere:</span> <span class="text-dark fw-bold" id="follower-count">123</span></p>
                        <p class="mb-2"><span class="text-dark">Følger:</span> <span class="text-dark fw-bold" id="following-count">45</span></p>
                        <p>I am a passionate yoga enthusiast dedicated to sharing tips and videos to inspire others in the yoga community.</p>
                        <button class="btn cta-profile">Follow</button>
                    </div>
                </div>
            </div>
        </section>

        <!-- Posts Section -->
        <section>
            <h4 class="mb-4">Latest Posts</h4>
            <div class="list-group">
                <!-- Innlegg blir lagt til her av renderPosts.js -->
            </div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center text-lg-start mt-5 py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0 text-center">
                    <p class="mb-0">© 2024 UnityYoga. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-center">
                    <a href="#" class="text-dark">Privacy Policy</a> |
                    <a href="#" class="text-dark">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>

    <!-- Logout script -->
    <script type="module" src="/js/logout/logout.js"></script>
    <!-- Render Posts script -->
    <script type="module" src="/js/posts/renderPosts.js"></script>
</body>
</html>
