<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Feed</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/css/style.css">
    <!-- Bootstrap Icons -->
    <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.10.5/font/bootstrap-icons.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand ms-3" href="/index.html">UnityYoga</a>
            <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-3">
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/index.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline active" href="#">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/post/post-detail.html">Post</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container">
        <!-- Search and Sort Section -->
        <section class="d-flex justify-content-between mb-4 mt-5">
            <input type="text" id="search-input" class="form-control me-2" placeholder="Search posts">
            <select class="form-control w-auto">
                <option selected>Sort by</option>
                <option value="1">Newest</option>
                <option value="2">Oldest</option>
                <option value="3">Most Popular</option>
            </select>
        </section>

        <!-- Posts Section -->
        <section>
            <h4 class="mb-4">Your Posts</h4>
            <div class="list-group" id="post-list"></div>
        </section>

        <!-- API Test Container -->
        <section id="api-test-container" class="mb-5">
            <h4>API Test Result:</h4>
            <div id="api-test-result" class="alert alert-info">Venter på data fra API...</div>
        </section>
    </main>

    <!-- Footer -->
    <footer class="text-center text-lg-start mt-5 py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0 text-center">
                    <p class="mb-0">© 2024 UnityYoga. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-center">
                    <a href="#" class="text-dark">Privacy Policy</a> |
                    <a href="#" class="text-dark">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
    <script src="/js/feedFilter.js"></script>
</body>
</html>
