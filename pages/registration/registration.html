<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | UnityYoga</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand ms-3" href="/index.html">UnityYoga</a>
            <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-3">
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/login/login.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline active" href="/pages/registration/registration.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/feed/feed.html">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/post/post-detail.html">Post</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
        <div class="registration-box mx-auto p-4">
            <h1 class="text-center mb-4">Register</h1>
            <form id="registration-form">
                <div class="form-group mb-3">
                    <label for="register-name">Name:</label>
                    <input 
                        type="text" 
                        id="register-name" 
                        class="form-control" 
                        placeholder="Your username" 
                        required>
                </div>
                <div class="form-group mb-3">
                    <label for="register-email">Email:</label>
                    <input 
                        type="email" 
                        id="register-email" 
                        class="form-control" 
                        placeholder="user@noroff.no" 
                        required>
                </div>
                <div class="form-group mb-3">
                    <label for="register-password">Password:</label>
                    <input 
                        type="password" 
                        id="register-password" 
                        class="form-control" 
                        placeholder="Minimum 8 characters" 
                        minlength="8" 
                        required>
                </div>
                <button type="submit" class="btn btn-primary w-100">Register</button>
                <div id="error" class="text-danger mt-3"></div>
            </form>
            <p class="text-center mt-3">
                Already have an account? <a href="/pages/login/login.html">Login here</a>
            </p>
        </div>
    </main>

    <!-- Footer -->
    <footer class="text-center text-lg-start py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0 text-center">
                    <p class="mb-0">© 2024 UnityYoga. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-center">
                    <a href="#" class="text-dark">Privacy Policy</a> |
                    <a href="#" class="text-dark">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
    <script type="module" src="/js/registration/registration.js"></script>


</body>
</html>
