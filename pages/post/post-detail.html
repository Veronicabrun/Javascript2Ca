<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Post Detail | UnityYoga</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand ms-3" href="/index.html">UnityYoga</a>
            <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-3">
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/feed/feed.html">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline active" href="#">Post</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

    <!-- Main Content -->
    <main class="container-lg py-4 mt-5 mb-5">
        <!-- Post Detail Section -->
        <section class="card">
            <div class="row g-0">
                <!-- Left Column: Image -->
                <div class="col-md-6">
                    <img src="" class="card-img post-image" alt="Post Image">
                </div>
                

                <!-- Right Column: Title and Content -->
                <div class="col-md-6">
                    <div class="card-body">
                        <h2 class="card-title"></h2> <!-- Fylles med JavaScript -->
                        <h6 class="text-muted"></h6> <!-- Fylles med JavaScript -->
                        <p class="card-text mt-3"></p> <!-- Fylles med JavaScript -->

                         <!-- Edit and Delete Section -->
        <section class="mt-4">
            <h5>Edit or Delete Post</h5>
            <form id="edit-post-form" class="d-flex flex-column">
                <div class="mb-3">
                    <label for="edit-post-title" class="form-label">Title</label>
                    <input type="text" class="form-control" id="edit-post-title" placeholder="Edit post title" required>
                </div>
                <div class="mb-3">
                    <label for="edit-post-body" class="form-label">Body</label>
                    <textarea class="form-control" id="edit-post-body" rows="3" placeholder="Edit post content" required></textarea>
                </div>
                <div class="justify-content-start">
                    <button type="submit" class="btn btn-primary custom-edit-btn">Update Post</button>
                    <button type="button" class="btn btn-danger custom-delete-btn" id="delete-post-button">Delete Post</button>
                </div>
            </form>
        </section>

                       
                    </div>
                </div>
            </div>
        </section>  
          
    </main>

    <!-- Footer -->
    <footer class="text-center text-lg-start mt-5 py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0 text-center">
                    <p class="mb-0">© 2024 UnityYoga. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-center">
                    <a href="#" class="text-dark">Privacy Policy</a> |
                    <a href="#" class="text-dark">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
    <!-- JavaScript File -->
 
    <script type="module" src="/js/posts/ui/postDetail.js"></script>


</body>
</html>
