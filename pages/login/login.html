<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UnityYoga</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/css/style.css">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand ms-3" href="/index.html">UnityYoga</a>
            <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-3">
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/index.html">Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline active" href="/index.html">Login</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/registration/registration.html">Register</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/feed/feed.html">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/post/post-detail.html">Post</a>
                    </li>
                </ul>
            </div>
        </nav>
    </header>

<!-- Main Content -->
<main class="container mt-5 d-flex justify-content-center align-items-center" style="min-height: 100vh;">
    <div class="login-box">
        <h1 class="text-center mb-4">Login</h1>
        <form id="login-form" class="form-login">
            <div class="form-group mb-3">
                <label for="login-email">Email:</label>
                <input 
                    type="email" 
                    id="login-email" 
                    class="form-control" 
                    placeholder="user@noroff.no"
                    pattern="[\w\-.]+@(stud.)?noroff.no$" 
                    title="Please use a valid Noroff email address (e.g., user@noroff.no or user@stud.noroff.no)" 
                    required>
            </div>
            <div class="form-group mb-3">
                <label for="login-password">Password:</label>
                <input 
                    type="password" 
                    id="login-password" 
                    class="form-control" 
                    placeholder="Enter your password" 
                    minlength="8" 
                    required>
            </div>
            <button type="submit" class="btn btn-primary w-100">Login</button>
            <div id="error" class="text-danger mt-3"></div>
        </form>
        <p class="text-center mt-3">
            Don't have an account? <a href="/pages/registration/registration.html">Register here</a>
        </p>
    </div>
</main>


     <!-- Footer -->
     <footer class="text-center text-lg-start py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0 text-center">
                    <p class="mb-0">© 2024 UnityYoga. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-center">
                    <a href="#" class="text-dark">Privacy Policy</a> |
                    <a href="#" class="text-dark">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
    
    <script type="module" src="/js/login/login.js"></script>

  
</body>
</html>
