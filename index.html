<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | UnityYoga</title>
    <!-- Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="../../dist/css/style.css">
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css" rel="stylesheet">
</head>
<body>
    <!-- Header -->
    <header>
        <nav class="navbar navbar-expand-lg">
            <a class="navbar-brand ms-3" href="/index.html">UnityYoga</a>
            <button class="navbar-toggler me-3" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                    aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav ms-3">
                    <li class="nav-item">
                        <a class="nav-link hover-underline active" href="/index.html"><i class="fas fa-home me-2"></i>Home</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/feed/feed.html">Feed</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link hover-underline" href="/pages/post/post-detail.html">Post</a>
                    </li>
                </ul>
                <button id="logout-button" class="btn ms-auto me-3 d-flex align-items-center">
                    <i class="bi bi-box-arrow-right me-2"></i> Log Out
                </button>
            </div>
        </nav>
    </header>
    <!-- Main Content -->
    <main class="container-fluid full-height">
        <div class="row h-100">
            <section class="col-md-4 col-lg-3 d-flex flex-column justify-content-center align-items-start p-4 bg-light">
                <h1 class="display-4">Yoga Community</h1>
                <p class="lead">Connect with yogis worldwide to share exercises, tips, and advice. Join us today!</p>
                <div class="d-flex">
                    <button type="button" class="btn custom-login rounded-pill me-3" data-bs-toggle="modal" data-bs-target="#loginModal">
                        Login
                    </button>
                    <button type="button" class="btn custom-register rounded-pill" data-bs-toggle="modal" data-bs-target="#registerModal">
                        Register
                    </button>
                </div>
            </section>
            <section class="col-md-8 col-lg-9 p-0">
                <img src="/images/front_page2.jpg" alt="Yoga" class="img-fluid img-cover">
            </section>
        </div>
    </main>
    <!-- Login Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1" aria-labelledby="loginModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="loginModalLabel">Login</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="login-form" class="form-login">
                        <div class="form-group mb-3">
                            <label for="login-email">Email:</label>
                            <input 
                                type="email" 
                                id="login-email" 
                                class="form-control" 
                                placeholder="user@noroff.no"
                                pattern="[\w\-.]+@(stud.)?noroff.no$" 
                                title="Please use a valid Noroff email address (e.g., user@noroff.no or user@stud.noroff.no)" 
                                required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="login-password">Password:</label>
                            <input 
                                type="password" 
                                id="login-password" 
                                class="form-control" 
                                placeholder="Enter your password" 
                                minlength="8" 
                                required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Login</button>
                        <div id="error" class="text-danger mt-3"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <p class="text-center mt-3">
                        Don't have an account? <a href="#" data-bs-toggle="modal" data-bs-target="#registerModal" data-bs-dismiss="modal">Register here</a>
                    </p>   
                </div>
            </div>
        </div>
    </div>
    <!-- Register Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1" aria-labelledby="registerModalLabel" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="registerModalLabel">Register</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <form id="registration-form" class="form-register">
                        <div class="form-group mb-3">
                            <label for="register-name">Name:</label>
                            <input 
                                type="text" 
                                id="register-name" 
                                class="form-control" 
                                placeholder="Your username" 
                                required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="register-email">Email:</label>
                            <input 
                                type="email" 
                                id="register-email" 
                                class="form-control" 
                                placeholder="user@noroff.no"
                                pattern="[\w\-.]+@(stud.)?noroff.no$" 
                                title="Please use a valid Noroff email address (e.g., user@noroff.no or user@stud.noroff.no)" 
                                required>
                        </div>
                        <div class="form-group mb-3">
                            <label for="register-password">Password:</label>
                            <input 
                                type="password" 
                                id="register-password" 
                                class="form-control" 
                                placeholder="Minimum 8 characters" 
                                minlength="8" 
                                required>
                        </div>
                        <button type="submit" class="btn btn-primary w-100">Register</button>
                        <div id="error" class="text-danger mt-3"></div>
                    </form>
                </div>
            </div>
        </div>
    </div>
    <!-- Footer -->
    <footer class="text-center text-lg-start py-5">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0 text-center">
                    <p class="mb-0">© 2024 UnityYoga. All rights reserved.</p>
                </div>
                <div class="col-md-6 text-center">
                    <a href="#" class="text-dark">Privacy Policy</a> |
                    <a href="#" class="text-dark">Terms of Service</a>
                </div>
            </div>
        </div>
    </footer>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.11.6/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.2.0/dist/js/bootstrap.min.js"></script>
    <!-- JavaScript File -->
    <script type="module" src="/js/login/login.js"></script>
    <script type="module" src="/js/registration/registration.js"></script>   
</body>
</html>
